<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12241a">
<title>곤충 무술 도장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: one theatre column. The 16:9 stage leads, controls and chapter chips sit under it, then the roster of the dojo's insects. Single deliberate night-forest look for TV watching. */
:root{
  --bg:#12241a; --panel:#1a3125; --panel2:#22402f; --line:#2f5140; --fg:#f4eedb; --mute:#a9c0b0; --honey:#f2b84b; --ink:#1f1a14;
  --tkd:#ff6b6b; --judo:#4dabf7; --wr:#20c997; --bjj:#845ef7;
  --display:"Black Han Sans","Jua",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Jua",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
header h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,46px);line-height:1.1;margin:0;color:var(--honey);text-wrap:balance}
header p{margin:0;color:var(--mute)}
.stage{position:relative;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line)}
.screen{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;margin:0 auto;container-type:inline-size}
#cv{display:block;width:100%;height:100%}
.stage:fullscreen{display:flex;align-items:center;justify-content:center;border-radius:0}
.stage:fullscreen .screen{width:min(100vw,177.78vh)}
.stage:-webkit-full-screen{display:flex;align-items:center;justify-content:center;border-radius:0}
.stage:-webkit-full-screen .screen{width:min(100vw,177.78vh)}
.cap{position:absolute;left:0;right:0;bottom:0;padding:1.4cqw 3cqw 1.8cqw;background:linear-gradient(to top,rgba(9,16,12,.86),rgba(9,16,12,.6) 70%,rgba(9,16,12,0));pointer-events:none;font-size:16px;font-size:clamp(13px,3cqw,38px);line-height:1.3;display:flex;flex-direction:column;gap:.2em}
.cap:empty{display:none}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:.3em .4em;font-size:.8em}
.who:empty{display:none}
.who b{font-weight:400;color:#fff}
.who i{font-style:normal;color:#cfe0d3}
.art{display:inline-block;padding:0 .55em;border-radius:999px;color:#fff;font-size:.88em;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.line{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45);text-wrap:balance}
.big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,14,10,.28);border:0;cursor:pointer;padding:0;font-family:var(--display);font-size:20px;font-size:clamp(20px,5cqw,52px);color:var(--ink)}
.big span{background:var(--honey);padding:.3em 1.1em;border-radius:999px;box-shadow:0 .14em 0 #b9862a}
.big:focus-visible span{outline:4px solid #fff;outline-offset:4px}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{font-family:var(--body);font-size:15px;line-height:1.2;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:9px 14px;cursor:pointer}
.btn:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
#pp{background:var(--honey);color:var(--ink);border-color:var(--honey);min-width:54px;font-size:16px}
.seekrow{display:flex;align-items:center;gap:10px;flex:1 1 240px;min-width:0}
#seek{flex:1;min-width:0;accent-color:var(--honey)}
#tm{font-variant-numeric:tabular-nums;color:var(--mute);font-size:14px;white-space:nowrap}
.tog[aria-pressed="false"]{color:var(--mute);border-style:dashed}
.voicebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;color:var(--mute);font-size:14.5px}
.voicebar label{color:var(--fg)}
.voicebar select,.voicebar input{font-family:var(--body);font-size:15px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;max-width:100%}
.voicebar input{flex:1 1 220px}
.vstat{flex:1 1 200px;min-width:0}
.chap{display:flex;flex-wrap:wrap;gap:8px}
.chap .btn.on{background:var(--panel2);border-color:var(--honey);color:var(--honey)}
section h2{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.2;margin:14px 0 2px}
.note{color:var(--mute);margin:0 0 10px;max-width:62ch}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.card canvas{width:100%;max-width:100%;aspect-ratio:1/1;border-radius:10px;background:radial-gradient(circle at 50% 70%,#2c5038,#1d3829 70%)}
.card .tag{align-self:flex-start;font-size:12px;letter-spacing:.04em;color:var(--ink);background:var(--honey);border-radius:999px;padding:1px 8px}
.card h3{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.15}
.card h3 small{font-family:var(--body);font-size:15px;color:var(--mute);margin-left:6px}
.card .arts{display:flex;flex-wrap:wrap;gap:4px}
.card .arts .art{font-size:13px;padding:1px 8px}
.card p{margin:0;font-size:14.5px;line-height:1.45;color:#dfe8de}
.card p b{font-weight:400;color:var(--honey)}
.card .btn{margin-top:auto;align-self:flex-start;font-size:14px;padding:7px 12px}
.card.locked h3,.card.locked p{color:var(--mute)}
@media (prefers-reduced-motion: reduce){ .big span{box-shadow:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>곤충 무술 도장</h1>
    <p>1화 · 네 가지를 배운 매미 · 약 3분 30초</p>
  </header>

  <div class="stage" id="stage">
    <div class="screen" id="screen">
      <canvas id="cv" aria-label="곤충 무술 도장 애니메이션"></canvas>
      <div class="cap" id="cap"><div class="who" id="who"></div><div class="line" id="line"></div></div>
      <button class="big" id="big" type="button"><span id="bigt">▶ 보기</span></button>
    </div>
  </div>

  <div class="ctrl">
    <button class="btn" id="pp" type="button" aria-label="재생">▶</button>
    <div class="seekrow">
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="재생 위치">
      <span id="tm">0:00 / 0:00</span>
    </div>
    <button class="btn tog" id="rd" type="button" aria-pressed="true">목소리 켬</button>
    <button class="btn tog" id="snd" type="button" aria-pressed="true">효과음 켬</button>
    <button class="btn" id="fs" type="button">크게 보기</button>
  </div>
  <div class="voicebar">
    <label for="gv">목소리</label>
    <select id="gv"></select>
    <span class="vstat" id="vstat" aria-live="polite"></span>
    <a class="btn" id="siteLink" href="https://jeonjubulldozer.github.io/hajun-english/dojo/" target="_blank" rel="noopener" hidden>목소리 나오는 버전 열기 ↗</a>
    <input id="gkey" type="password" autocomplete="off" placeholder="제미나이 키 붙여 넣기 (AIza…)" hidden>
  </div>
  <nav class="chap" id="chap" aria-label="장면"></nav>

  <section>
    <h2>도장 식구들</h2>
    <p class="note" id="linkNote"></p>
    <div class="legend" id="legend"></div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<script>
(()=>{
'use strict';
const W=960,H=540,G=395,TAU=Math.PI*2,PI=Math.PI;
const ART={tkd:['태권도','#ff6b6b'],judo:['유도','#4dabf7'],wr:['레슬링','#20c997'],bjj:['주짓수','#845ef7']};
const HONEY='#f2b84b',OUT='#1f1a14';
const BL={th:34,sn:34,ft:9,ua:24,fa:24,bc:36,so:58,hd:92};
const LL=o=>Object.assign({},BL,o||{});

/* ---------- 곤충 식구들 ---------- */
const SP={
 rhino:{n:'번쩍이',k:'장수풍뎅이',tag:'사범님',arts:['wr'],s:1.12,L:LL({hd:88}),rx:30,ry:40,hr:18,col:'#8a4520',lc:'#3c1b0b',hc:'#4e2410',lw:10,ant:'short',dark:1,
   moves:'레벨 체인지 · 더블렉 태클 · 번쩍 들기',fact:'뿔을 상대 밑에 넣고 번쩍 들어서 뒤집어요.'},
 stag:{n:'집게',k:'사슴벌레',tag:'사범님',arts:['judo'],s:1.06,L:LL(),rx:25,ry:38,hr:20,col:'#3e271a',lc:'#22140c',hc:'#2e1c12',lw:9,ant:'short',dark:1,eye:[4,-8,8.6],
   moves:'잡기 · 기울이기 · 업어치기',fact:'큰 턱으로 상대를 집어서 던져요.'},
 mantis:{n:'꽉이',k:'사마귀',tag:'사범님',arts:['bjj'],s:1.08,L:LL({th:38,sn:38,ua:26,fa:28,bc:40,so:66,hd:100}),rx:17,ry:44,hr:18,col:'#69b94a',lc:'#4f9a36',hc:'#7acb59',lw:7,ant:'thin',head:'tri',eye:[11,-10,7.5],mouth:[6,10],
   moves:'가드 · 스윕 · 꽉 잡기',fact:'가만히 기다렸다가 앞다리로 순식간에 잡아요.'},
 hop:{n:'팡이',k:'메뚜기',tag:'사범님',arts:['tkd'],s:1.0,L:LL({th:36,sn:36}),rx:20,ry:40,hr:20,col:'#8cbf3f',lc:'#6f9e2c',hc:'#9acb4a',lw:8,tw:2.1,ant:'short',
   moves:'거리 재기 · 뒤후려차기 · 뛰어 앞차기',fact:'뒷다리로 몸길이의 스무 배쯤 뛰어요.'},
 lady:{n:'동글이',k:'무당벌레',tag:'두 가지',arts:['judo','bjj'],s:.88,L:LL({th:28,sn:28,bc:34,so:54,hd:84}),rx:30,ry:35,hr:17,col:'#e63a2e',lc:'#1c1c1c',hc:'#1c1c1c',lw:8,ant:'short',dark:1,
   moves:'데굴데굴 앞구르기 · 낙법',fact:'위험하면 뒤집혀서 죽은 척을 해요.'},
 butter:{n:'팔랑이',k:'나비',tag:'두 가지',arts:['tkd','bjj'],s:.94,L:LL({th:36,sn:36}),rx:13,ry:38,hr:16,col:'#2b2b2b',lc:'#2b2b2b',hc:'#353535',lw:6,ant:'club',wing:'butter',dark:1,
   moves:'톡톡 스텝 · 앞차기 · 버터플라이 스윕',fact:'날개가 아주 작은 비늘로 덮여 있어요.'},
 katy:{n:'긴다리',k:'여치',tag:'두 가지',arts:['wr','tkd'],s:1.0,L:LL({th:38,sn:38}),rx:24,ry:38,hr:20,col:'#5fb04a',lc:'#4b9139',hc:'#6cbd56',lw:8,tw:1.9,ant:'long',
   moves:'긴 다리 앞차기 · 바로 태클',fact:'날개를 비벼서 찌르르 노래해요.'},
 fire:{n:'반짝이',k:'반딧불이',tag:'두 가지',arts:['judo','tkd'],s:.9,L:LL(),rx:21,ry:38,hr:17,col:'#26262b',lc:'#1d1d22',hc:'#2a2a30',lw:7,ant:'thin',glow:1,dark:1,eye:[6,3,7],mouth:[10,11],
   moves:'반짝하는 순간 허리 넣어 메치기',fact:'꽁무니 불빛으로 친구와 신호를 주고받아요.'},
 bee:{n:'윙윙이',k:'꿀벌',tag:'세 가지',arts:['tkd','wr','judo'],s:.9,L:LL({th:30,sn:30}),rx:26,ry:36,hr:18,col:'#fcc419',lc:'#2a2210',hc:'#2a2210',lw:7,ant:'elbow',wing:'bee',dark:1,
   moves:'슉슉슉 연속 발차기 · 싱글렉 · 넘기기',fact:'날개를 1초에 이백 번 넘게 움직여요.'},
 bang:{n:'콩콩이',k:'방아깨비',tag:'세 가지',arts:['wr','judo','bjj'],s:1.08,L:LL({th:42,sn:42,ua:27,fa:27,bc:42,so:70,hd:104}),rx:15,ry:50,hr:15,col:'#7cc35c',lc:'#64a948',hc:'#86cc66',lw:6,tw:1.7,ant:'sword',head:'cone',eye:[14,-10,6.5],mouth:[20,2],
   moves:'방아 찧기 레벨 체인지 · 더블렉 · 누르기',fact:'뒷다리를 잡으면 방아 찧듯 몸을 끄덕여요.'},
 cicada:{n:'맴맴이',k:'매미',tag:'네 가지',arts:['tkd','judo','wr','bjj'],s:1.0,L:LL(),rx:25,ry:38,hr:19,col:'#3f4a2c',lc:'#2f3820',hc:'#4a5733',lw:8,ant:'short',head:'wide',wing:'cicada',hero:1,dark:1,eye:[13,-2,8.4],mouth:[15,9],
   moves:'낙법 · 스프롤 · 메치기 · 오모플라타',fact:'애벌레는 땅속에서 몇 년이나 자라요.'},
 dummy:{n:'짚인형',k:'연습 인형',arts:[],s:1.0,L:LL({ua:20,fa:18,th:30,sn:30,hd:86}),rx:26,ry:38,hr:20,col:'#d2ab6c',lc:'#c49b5d',hc:'#d8b376',lw:13,ant:'none',noface:1}
};
Object.keys(SP).forEach((k,i)=>{SP[k].id=k;SP[k].ph=i*1.37});
const ORDER=['rhino','stag','mantis','hop','lady','butter','katy','fire','bee','bang','cicada'];
const UNLOCK={lady:5,butter:10,katy:15,fire:25,bee:35,bang:50};

/* ---------- 하준이 미션 앱 연동 (같은 사이트에 올렸을 때만) ---------- */
function readApp(){
  try{
    const raw=localStorage.getItem('hajun-log-v1'); if(!raw) return null;
    const d=JSON.parse(raw); if(!d||typeof d!=='object') return null;
    const n=new Date(),p=x=>String(x).padStart(2,'0'),td=`${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}`;
    let dj=0,days=0;
    for(const k in d){ if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&k<=td){ days++; const pl=d[k]&&d[k].places; if(Array.isArray(pl)) dj+=pl.length } }
    return days?{dj}:null;
  }catch(e){ return null }
}
const LINK=readApp();
const isLocked=id=>!!(LINK&&UNLOCK[id]&&LINK.dj<UNLOCK[id]);

/* ---------- 자세 ---------- */
const PO={
 stand:{tl:0,flh:.06,flk:.06,blh:-.06,blk:.06,fah:.25,fae:.35,bah:-.15,bae:.35,ex:0},
 guard:{tl:.12,flh:.38,flk:.45,blh:-.38,blk:.35,fah:1.05,fae:1.4,bah:.8,bae:1.6,ex:1},
 low:{tl:.55,flh:.75,flk:1.15,blh:-.3,blk:.95,fah:1.25,fae:.6,bah:1.05,bae:.85,ex:1},
 shoot:{tl:1.05,flh:1.25,flk:1.7,blh:-.7,blk:.3,fah:1.75,fae:.3,bah:1.6,bae:.35,ex:1},
 squat:{tl:.35,flh:.95,flk:1.5,blh:-.05,blk:1.1,fah:1.6,fae:.5,bah:1.5,bae:.6,ex:1},
 lift:{tl:-.05,flh:.3,flk:.3,blh:-.25,blk:.2,fah:2.85,fae:.2,bah:2.75,bae:.25,ex:1},
 grip:{tl:.1,flh:.28,flk:.25,blh:-.28,blk:.2,fah:1.45,fae:.35,bah:1.25,bae:.7,ex:1},
 turn:{tl:.95,flh:.65,flk:1.15,blh:.1,blk:1.15,fah:2.0,fae:1.3,bah:1.6,bae:1.7,ex:1},
 finish:{tl:1.25,flh:.55,flk:.6,blh:-.65,blk:.3,fah:.9,fae:.3,bah:.6,bae:.4,ex:1},
 chamber:{tl:-.1,flh:1.55,flk:2.0,blh:-.05,blk:.05,fah:1.0,fae:1.5,bah:.4,bae:1.3,ex:1},
 kick:{tl:-.4,flh:1.8,flk:.05,blh:-.05,blk:.05,fah:.6,fae:1.3,bah:-.25,bae:1.1,ex:1},
 spin:{tl:.75,flh:.12,flk:.15,blh:-2.15,blk:.08,fah:.7,fae:1.1,bah:.25,bae:.9,ex:1},
 tuck:{tl:.1,flh:1.35,flk:2.1,blh:.95,blk:2.2,fah:2.4,fae:.5,bah:2.2,bae:.5,ex:1},
 back:{tl:.25,flh:1.7,flk:1.05,blh:1.35,blk:1.5,fah:1.4,fae:.9,bah:1.2,bae:1.1,ex:1},
 flat:{tl:0,flh:.18,flk:.12,blh:.06,blk:.12,fah:.5,fae:.2,bah:.25,bae:.2,ex:2},
 top:{tl:.9,flh:.5,flk:2.05,blh:.1,blk:1.7,fah:1.85,fae:.45,bah:1.65,bae:.45,ex:1},
 sprawl:{tl:1.35,flh:-.45,flk:.35,blh:-.95,blk:.2,fah:1.45,fae:.8,bah:1.25,bae:.9,ex:1},
 bow:{tl:.75,flh:0,flk:0,blh:0,blk:0,fah:.12,fae:.1,bah:.08,bae:.1,ex:3},
 cheer:{tl:-.05,flh:.1,flk:.1,blh:-.1,blk:.1,fah:2.7,fae:.5,bah:2.5,bae:.5,ex:3},
 sit:{tl:.2,flh:2.2,flk:2.2,blh:2.0,blk:2.0,fah:1.3,fae:.6,bah:1.1,bae:.8,ex:1}
};
const EZ={io:u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2,out:u=>1-Math.pow(1-u,3),in:u=>u*u*u,lin:u=>u};
const easeBack=u=>1+2.70158*Math.pow(u-1,3)+1.70158*Math.pow(u-1,2);

function norm(fr){
  fr=fr.slice().sort((a,b)=>a[0]-b[0]);
  let prev=Object.assign({x:480,y:0,rot:0,f:1,gl:0},PO.stand);
  return fr.map(([t,name,o])=>{const p=Object.assign({},prev,name?PO[name]:{},o||{});prev=p;return{t,p,e:(o&&o.e)||'io'}});
}
function samp(F,t){
  if(t<=F[0].t) return F[0].p;
  for(let i=1;i<F.length;i++){
    if(t<F[i].t){
      const a=F[i-1],b=F[i];let u=(t-a.t)/(b.t-a.t);u=(EZ[b.e]||EZ.io)(u);
      const p={};
      for(const k in b.p){const va=a.p[k],vb=b.p[k];p[k]=(typeof vb==='number'&&typeof va==='number'&&k!=='f'&&k!=='ex')?va+(vb-va)*u:(u<.5?va:vb)}
      return p;
    }
  }
  return F[F.length-1].p;
}

/* ---------- 몸 계산 ---------- */
const DR=a=>[Math.sin(a),Math.cos(a)];
function geo(sp,P){
  const l=sp.L,t=P.tl,A=d=>[Math.sin(t)*d,-Math.cos(t)*d];
  const leg=(h,k,ox)=>{const d1=DR(h),kn=[ox+d1[0]*l.th,d1[1]*l.th],d2=DR(h-k),ft=[kn[0]+d2[0]*l.sn,kn[1]+d2[1]*l.sn],d3=DR(h-k+PI/2);return{hip:[ox,0],kn,ft,toe:[ft[0]+d3[0]*l.ft,ft[1]+d3[1]*l.ft]}};

const minis=[];
ORDER.forEach(id=>{
  const sp=SP[id],lk=isLocked(id),card=document.createElement('article');card.className='card'+(lk?' locked':'');
  card.innerHTML=`<canvas aria-hidden="true"></canvas><span class="tag">${sp.tag}</span><h3>${lk?'???':sp.n}<small>${lk?'':sp.k}</small></h3><div class="arts">${lk?'':sp.arts.map(chipHTML).join('')}</div>`+
   (lk?`<p>${lockText(id)}</p>`:`<p><b>필살기</b> ${sp.moves}</p><p><b>진짜 ${sp.k}</b> ${sp.fact}</p>`)+
   `<button class="btn" type="button"${lk?' disabled':''}>이 장면 보기 ▶</button>`;
  card.querySelector('button').onclick=()=>{jump(SC[idx(SHOW[id])].start);if(!PLAY)play();stage.scrollIntoView({behavior:'smooth',block:'start'})};
  grid.appendChild(card);minis.push([card.querySelector('canvas'),id,lk]);
});
function drawMinis(){
  for(const [m,id,lk] of minis){
    const w=m.clientWidth||200,dpr=Math.min(2,window.devicePixelRatio||1);m.width=Math.round(w*dpr);m.height=Math.round(w*dpr);
    const c=m.getContext('2d');c.setTransform(m.width/240,0,0,m.width/240,0,0);c.clearRect(0,0,240,240);
    c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(120,214,62,9,0,0,TAU);c.fill();
    const sp=SP[id],P=Object.assign({x:id==='katy'?140:120,y:0,rot:0,f:1,gl:.3,sc:.74},id==='cicada'?PO.cheer:PO.guard,{ex:id==='cicada'?3:0});
    place(sp,P,214);drawBug(c,sp,P,1.2,lk);
  }
}
try{new ResizeObserver(drawMinis).observe(grid)}catch(e){drawMinis()}
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('40px "Black Han Sans"'),document.fonts.load('27px "Jua"')]).then(()=>{DIRTY=true}).catch(()=>{})}
gT=.9;requestAnimationFrame(loop);prefetch();
})();
</script>
</body>
</html>
