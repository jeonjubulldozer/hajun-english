<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12241a">
<title>곤충 무술 도장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: one theatre column. The 16:9 stage leads, controls and chapter chips sit under it, then the roster of the dojo's insects. Single deliberate night-forest look for TV watching. */
:root{
  --bg:#12241a; --panel:#1a3125; --panel2:#22402f; --line:#2f5140; --fg:#f4eedb; --mute:#a9c0b0; --honey:#f2b84b; --ink:#1f1a14;
  --tkd:#ff6b6b; --judo:#4dabf7; --wr:#20c997; --bjj:#845ef7;
  --display:"Black Han Sans","Jua",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Jua",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
header h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,46px);line-height:1.1;margin:0;color:var(--honey);text-wrap:balance}
header p{margin:0;color:var(--mute)}
.eps{display:flex;gap:6px;margin-left:auto}
.eps .btn{font-family:var(--display);font-size:17px;padding:7px 16px}
.eps .btn.on{background:var(--honey);color:var(--ink);border-color:var(--honey)}
.stage{position:relative;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line)}
.screen{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;margin:0 auto;container-type:inline-size}
#cv{display:block;width:100%;height:100%}
.stage:fullscreen{display:flex;align-items:center;justify-content:center;border-radius:0}
.stage:fullscreen .screen{width:min(100vw,177.78vh)}
.stage:-webkit-full-screen{display:flex;align-items:center;justify-content:center;border-radius:0}
.stage:-webkit-full-screen .screen{width:min(100vw,177.78vh)}
.cap{position:absolute;left:0;right:0;bottom:0;padding:1.4cqw 3cqw 1.8cqw;background:linear-gradient(to top,rgba(9,16,12,.86),rgba(9,16,12,.6) 70%,rgba(9,16,12,0));pointer-events:none;font-size:16px;font-size:clamp(13px,3cqw,38px);line-height:1.3;display:flex;flex-direction:column;gap:.2em}
.cap:empty{display:none}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:.3em .4em;font-size:.8em}
.who:empty{display:none}
.who b{font-weight:400;color:#fff}
.who i{font-style:normal;color:#cfe0d3}
.art{display:inline-block;padding:0 .55em;border-radius:999px;color:#fff;font-size:.88em;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.line{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45);text-wrap:balance}
.big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,14,10,.28);border:0;cursor:pointer;padding:0;font-family:var(--display);font-size:20px;font-size:clamp(20px,5cqw,52px);color:var(--ink)}
.big span{background:var(--honey);padding:.3em 1.1em;border-radius:999px;box-shadow:0 .14em 0 #b9862a}
.big:focus-visible span{outline:4px solid #fff;outline-offset:4px}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{font-family:var(--body);font-size:15px;line-height:1.2;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:9px 14px;cursor:pointer}
.btn:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
#pp{background:var(--honey);color:var(--ink);border-color:var(--honey);min-width:54px;font-size:16px}
.seekrow{display:flex;align-items:center;gap:10px;flex:1 1 240px;min-width:0}
#seek{flex:1;min-width:0;accent-color:var(--honey)}
#tm{font-variant-numeric:tabular-nums;color:var(--mute);font-size:14px;white-space:nowrap}
.tog[aria-pressed="false"]{color:var(--mute);border-style:dashed}
.voicebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;color:var(--mute);font-size:14.5px}
.voicebar label{color:var(--fg)}
.voicebar select,.voicebar input{font-family:var(--body);font-size:15px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;max-width:100%}
.voicebar input{flex:1 1 220px}
.vstat{flex:1 1 200px;min-width:0}
.chap{display:flex;flex-wrap:wrap;gap:8px}
.chap .btn.on{background:var(--panel2);border-color:var(--honey);color:var(--honey)}
section h2{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.2;margin:14px 0 2px}
.note{color:var(--mute);margin:0 0 10px;max-width:62ch}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.card canvas{width:100%;max-width:100%;aspect-ratio:1/1;border-radius:10px;background:radial-gradient(circle at 50% 70%,#2c5038,#1d3829 70%)}
.card .tag{align-self:flex-start;font-size:12px;letter-spacing:.04em;color:var(--ink);background:var(--honey);border-radius:999px;padding:1px 8px}
.card h3{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.15}
.card h3 small{font-family:var(--body);font-size:15px;color:var(--mute);margin-left:6px}
.card .arts{display:flex;flex-wrap:wrap;gap:4px}
.card .arts .art{font-size:13px;padding:1px 8px}
.card p{margin:0;font-size:14.5px;line-height:1.45;color:#dfe8de}
.card p b{font-weight:400;color:var(--honey)}
.card .btn{margin-top:auto;align-self:flex-start;font-size:14px;padding:7px 12px}
.card.locked h3,.card.locked p{color:var(--mute)}
@media (prefers-reduced-motion: reduce){ .big span{box-shadow:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>곤충 무술 도장</h1>
    <p id="sub"></p>
    <nav class="eps" id="eps" aria-label="몇 화"></nav>
  </header>

  <div class="stage" id="stage">
    <div class="screen" id="screen">
      <canvas id="cv" aria-label="곤충 무술 도장 애니메이션"></canvas>
      <div class="cap" id="cap"><div class="who" id="who"></div><div class="line" id="line"></div></div>
      <button class="big" id="big" type="button"><span id="bigt">▶ 보기</span></button>
    </div>
  </div>

  <div class="ctrl">
    <button class="btn" id="pp" type="button" aria-label="재생">▶</button>
    <div class="seekrow">
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="재생 위치">
      <span id="tm">0:00 / 0:00</span>
    </div>
    <button class="btn tog" id="rd" type="button" aria-pressed="true">목소리 켬</button>
    <button class="btn tog" id="snd" type="button" aria-pressed="true">효과음 켬</button>
    <button class="btn" id="fs" type="button">크게 보기</button>
  </div>
  <div class="voicebar">
    <label for="gv">목소리</label>
    <select id="gv"></select>
    <span class="vstat" id="vstat" aria-live="polite"></span>
    <a class="btn" id="siteLink" href="https://jeonjubulldozer.github.io/hajun-english/dojo/" target="_blank" rel="noopener" hidden>목소리 나오는 버전 열기 ↗</a>
    <input id="gkey" type="password" autocomplete="off" placeholder="제미나이 키 붙여 넣기 (AIza…)" hidden>
  </div>
  <nav class="chap" id="chap" aria-label="장면"></nav>

  <section>
    <h2>도장 식구들</h2>
    <p class="note" id="linkNote"></p>
    <div class="legend" id="legend"></div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<script>

   moves:'반짝하는 순간 허리 넣어 메치기',fact:'꽁무니 불빛으로 친구와 신호를 주고받아요.'},

   moves:'슉슉슉 연속 발차기 · 싱글렉 · 넘기기',fact:'날개를 1초에 이백 번 넘게 움직여요.'},
 bang:{n:'콩콩이',k:'방아깨비',tag:'세 가지',arts:['wr','judo','bjj'],s:1.08,L:LL({th:42,sn:42,ua:27,fa:27,bc:42,so:70,hd:104}),rx:15,ry:50,hr:15,col:'#7cc35c',lc:'#64a948',hc:'#86cc66',lw:6,tw:1.7,ant:'sword',head:'cone',eye:[14,-10,6.5],mouth:[20,2],
   moves:'방아 찧기 레벨 체인지 · 더블렉 · 누르기',fact:'뒷다리를 잡으면 방아 찧듯 몸을 끄덕여요.'},
 cicada:{n:'맴맴이',k:'매미',tag:'네 가지',arts:['tkd','judo','wr','bjj'],s:1.0,L:LL(),rx:25,ry:38,hr:19,col:'#3f4a2c',lc:'#2f3820',hc:'#4a5733',lw:8,ant:'short',head:'wide',wing:'cicada',hero:1,dark:1,eye:[13,-2,8.4],mouth:[15,9],
   moves:'낙법 · 스프롤 · 메치기 · 오모플라타',fact:'애벌레는 땅속에서 몇 년이나 자라요.'},

Object.keys(SP).forEach((k,i)=>{SP[k].id=k;SP[k].ph=i*1.37});
SP.grass={n:'띵가',k:'베짱이',tag:'개인 레슨만',arts:['judo','wr'],s:1.0,L:LL({th:38,sn:38}),rx:22,ry:38,hr:19,col:'#a6c75c',lc:'#86a641',hc:'#b4d46a',lw:7,tw:1.8,ant:'long',
  moves:'기술 이름 외우기 · 기타 치며 노래',fact:'날개를 비벼서 베짱베짱 하고 울어요.',id:'grass',ph:17.3,ep:1,scene:'grass'};
const ORDER=['rhino','stag','mantis','hop','lady','butter','katy','fire','bee','bang','cicada','grass'];
const UNLOCK={lady:5,butter:10,katy:15,fire:25,bee:35,bang:50};

/* ---------- 하준이 미션 앱 연동 (같은 사이트에 올렸을 때만) ---------- */
function readApp(){
  try{
    const raw=localStorage.getItem('hajun-log-v1'); if(!raw) return null;
    const d=JSON.parse(raw); if(!d||typeof d!=='object') return null;
    const n=new Date(),p=x=>String(x).padStart(2,'0'),td=`${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}`;
    let dj=0,days=0;
    for(const k in d){ if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&k<=td){ days++; const pl=d[k]&&d[k].places; if(Array.isArray(pl)) dj+=pl.length } }
    return days?{dj}:null;
  }catch(e){ return null }
}
const LINK=readApp();
const isLocked=id=>!!(LINK&&UNLOCK[id]&&LINK.dj<UNLOCK[id]);

/* ---------- 자세 ---------- */
const PO={
 stand:{tl:0,flh:.06,flk:.06,blh:-.06,blk:.06,fah:.25,fae:.35,bah:-.15,bae:.35,ex:0},
 guard:{tl:.12,flh:.38,flk:.45,blh:-.38,blk:.35,fah:1.05,fae:1.4,bah:.8,bae:1.6,ex:1},

 tuck:{tl:.1,flh:1.35,flk:2.1,blh:.95,blk:2.2,fah:2.4,fae:.5,bah:2.2,bae:.5,ex:1},

 flat:{tl:0,flh:.18,flk:.12,blh:.06,blk:.12,fah:.5,fae:.2,bah:.25,bae:.2,ex:2},

 sprawl:{tl:1.35,flh:-.45,flk:.35,blh:-.95,blk:.2,fah:1.45,fae:.8,bah:1.25,bae:.9,ex:1},
 bow:{tl:.75,flh:0,flk:0,blh:0,blk:0,fah:.12,fae:.1,bah:.08,bae:.1,ex:3},

};
const EZ={io:u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2,out:u=>1-Math.pow(1-u,3),in:u=>u*u*u,lin:u=>u};
const easeBack=u=>1+2.70158*Math.pow(u-1,3)+1.70158*Math.pow(u-1,2);

function norm(fr){
  fr=fr.slice().sort((a,b)=>a[0]-b[0]);
  let prev=Object.assign({x:480,y:0,rot:0,f:1,gl:0,rust:0},PO.stand);
  return fr.map(([t,name,o])=>{const p=Object.assign({},prev,name?PO[name]:{},o||{});prev=p;return{t,p,e:(o&&o.e)||'io'}});
}
function samp(F,t){
  if(t<=F[0].t) return F[0].p;
  for(let i=1;i<F.length;i++){
    if(t<F[i].t){
      const a=F[i-1],b=F[i];let u=(t-a.t)/(b.t-a.t);u=(EZ[b.e]||EZ.io)(u);
      const p={};
      for(const k in b.p){const va=a.p[k],vb=b.p[k];p[k]=(typeof vb==='number'&&typeof va==='number'&&k!=='f'&&k!=='ex')?va+(vb-va)*u:(u<.5?va:vb)}
      return p;
    }
  }
  return F[F.length-1].p;
}

/* ---------- 몸 계산 ---------- */

const gKey=()=>(prefs.gkey||dojoKey()||'').trim();
const UA=navigator.userAgent,ANDROID=/Android/i.test(UA),INCHROME=/Chrome\//.test(UA)&&!/SamsungBrowser|; wv\)|EdgA|OPR|Whale|NAVER|KAKAOTALK|Instagram|FBAN/i.test(UA);
const sleepMs=ms=>new Promise(r=>setTimeout(r,ms));
const IDB=(()=>{const mem=new Map();let dbp=null;
  function db(){if(!dbp)dbp=new Promise(res=>{try{const r=indexedDB.open('insect-dojo',1);r.onupgradeneeded=()=>r.result.createObjectStore('clips');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});return dbp}
  async function op(mode,fn,fb){const d=await db();if(!d)return fb();return new Promise(res=>{try{const tx=d.transaction('clips',mode);const q=fn(tx.objectStore('clips'));tx.oncomplete=()=>res(q&&'result' in q?q.result:true);tx.onerror=()=>res(fb())}catch(e){res(fb())}})}
  return{get:k=>op('readonly',s=>s.get(k),()=>mem.get(k)||null).then(v=>v||mem.get(k)||null),put:(k,v)=>{mem.set(k,v);return op('readwrite',s=>s.put(v,k),()=>true)}}})();
function b64ToU8(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function pcmToWav(u8,rate){const n=u8.length,out=new Uint8Array(44+n),d=new DataView(out.buffer),str=(o,t)=>{for(let i=0;i<t.length;i++)d.setUint8(o+i,t.charCodeAt(i))};str(0,'RIFF');d.setUint32(4,36+n,true);str(8,'WAVE');str(12,'fmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,rate,true);d.setUint32(28,rate*2,true);d.setUint16(32,2,true);d.setUint16(34,16,true);str(36,'data');d.setUint32(40,n,true);out.set(u8,44);return out.buffer}
function mimeOf(buf){const x=new Uint8Array(buf,0,4);return(x[0]===0x52&&x[1]===0x49&&x[2]===0x46)?'audio/wav':'audio/mpeg'}
let ttsIdx=0,ttsExhaustedAt=0;
async function synth(text,voice){
  const key=gKey();if(!key)throw{code:'no_key',fatal:true};
  if(ttsIdx>=TTS_MODELS.length&&Date.now()-ttsExhaustedAt>10*60000)ttsIdx=0;
  let lastErr=null;
  for(let mi=ttsIdx;mi<TTS_MODELS.length;mi++){
    const model=TTS_MODELS[mi],preview=/preview/.test(model);let moveOn=true;
    for(let attempt=0;attempt<2;attempt++){
      let r;
      try{r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':key},
        body:JSON.stringify(preview?{contents:[{role:'user',parts:[{text:"Read this aloud in natural Korean, like a bright, warm children's cartoon narrator: "+text}]}],generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voice}}}}}
          :{contents:[{role:'user',parts:[{text,speech_metadata:{style:STYLE}}]}],generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{voice}}}})})}
      catch(e){throw{code:'network',message:'인터넷 연결을 확인해 주세요.'}}
      if(r.ok){
        const j=await r.json().catch(()=>({}));const part=((((j.candidates||[])[0]||{}).content||{}).parts||[]).find(x=>x.inlineData);
        if(part){ttsIdx=mi;const mime=part.inlineData.mimeType||'',u8=b64ToU8(part.inlineData.data);if(/wav/i.test(mime))return u8.buffer;return pcmToWav(u8,Number((mime.match(/rate=(\d+)/)||[])[1])||24000)}
        lastErr={code:'tts_failed',message:model+' 빈 응답'};moveOn=false;break;
      }
      const j=await r.json().catch(()=>({}));const msg=((j.error&&j.error.message)||'').slice(0,160);
      if(/API key not valid|API_KEY_INVALID/i.test(msg))throw{code:'bad_key',fatal:true,message:msg};
      lastErr={code:r.status===429?'rate_limited':'tts_failed',message:model.replace('gemini-','')+' '+r.status+' '+msg};
      if((r.status===429||r.status>=500)&&attempt===0){await sleepMs(3000);continue}
      break;
    }
    if(moveOn){ttsIdx=mi+1;if(ttsIdx>=TTS_MODELS.length)ttsExhaustedAt=Date.now()}
  }
  try{return await cloudSynth(text,voice,key)}catch(e){}
  const err=lastErr||{code:'tts_failed',message:''};err.fatal=err.code==='rate_limited';throw err;
}
async function cloudSynth(text,voice,key){
  const r=await fetch('https://texttospeech.googleapis.com/v1/text:synthesize',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':key},
    body:JSON.stringify({input:{text},voice:{languageCode:'ko-KR',name:'ko-KR-Chirp3-HD-'+voice},audioConfig:{audioEncoding:'MP3',speakingRate:1.0}})});
  if(!r.ok)throw{code:'cloud'};const j=await r.json();if(!j.audioContent)throw{code:'cloud'};return b64ToU8(j.audioContent).buffer;
}
function errCopy(e){
  if(!e)return'';
  if(e.code==='no_key')return'제미나이 키가 없어요.';
  if(e.code==='bad_key')return'제미나이 키가 맞지 않아요. 키를 다시 확인해 주세요.';
  if(e.code==='rate_limited')return'제미나이 목소리 한도에 잠시 걸렸어요. 조금 뒤 다시 열면 이어서 받아 와요.';
  if(e.code==='network')return e.message;
  return'목소리를 받아 오지 못했어요. ('+(e.message||e.code)+')';
}
const CLIP={},ckey=(v,t)=>v+'|'+t;
function ensure(text){
  const k=ckey(prefs.gv,text);let e=CLIP[k];if(e&&e.state!=='fail')return e.p;
  e=CLIP[k]={state:'busy'};
  e.p=(async()=>{let buf=await IDB.get(k);if(!buf){buf=await synth(text,prefs.gv);await IDB.put(k,buf)}e.state='ready';e.buf=buf;return buf})()
    .catch(err=>{e.state='fail';e.err=err;throw err});
  return e.p;
}
const AU=new Audio();AU.preload='auto';let AUurl='';
let NARR={beat:-1,state:'idle'};
AU.onended=()=>{NARR.state='done'};
function stopNarr(){try{AU.pause()}catch(e){}NARR={beat:-1,state:'idle'}}
function startNarr(i){
  stopNarr();
  if(!READ||!gKey()){NARR={beat:i,state:'done'};return}
  const text=sayOf(SC[i]),k=ckey(prefs.gv,text),me={beat:i,state:'wait',since:performance.now(),k};NARR=me;
  ensure(text).then(buf=>{
    if(NARR!==me)return;
    if(AUurl)URL.revokeObjectURL(AUurl);AUurl=URL.createObjectURL(new Blob([buf],{type:mimeOf(buf)}));AU.src=AUurl;me.state='play';
    if(PLAY){const p=AU.play();if(p&&p.catch)p.catch(()=>{me.state='done'})}
  }).catch(err=>{if(NARR===me){me.state='done';setV(errCopy(err))}});
}
const vstat=document.getElementById('vstat'),gvSel=document.getElementById('gv'),keyIn=document.getElementById('gkey'),siteLink=document.getElementById('siteLink');
const setV=t=>{vstat.textContent=t};
let PF=0;
function readyCount(){const ts=[...new Set(SC.map(sayOf))];return[ts.filter(t=>{const e=CLIP[ckey(prefs.gv,t)];return e&&e.state==='ready'}).length,ts.length]}
function showReady(){
  if(!READ){setV('목소리를 껐어요. 자막으로 봐요.');return}
  if(!gKey()){setV(!ONSITE?'목소리는 하준이 사이트 버전에서 나와요.':(ANDROID&&!INCHROME)?'이 브라우저에는 영어 도장 키가 없어요. 크롬으로 열면 목소리가 나와요.':'이 크롬에서 영어 도장 키를 못 찾았어요. 영어 도장이 열리는 크롬인지 확인하거나, 키를 붙여 넣어 주세요.');return}
  const [n,t]=readyCount();setV(n>=t?'목소리 준비 끝 · 바로 나와요':`목소리 받아 두는 중 ${n} / ${t} · 처음 한 번만 해요`);
}
async function prefetch(){
  const my=++PF;keyUI();showReady();if(!READ||!gKey())return;
  const s=Math.max(0,cur),order=[...new Set([...SC.slice(s),...SC.slice(0,s)].map(sayOf))];
  for(const t of order){
    if(my!==PF)return;
    try{await ensure(t)}catch(e){setV(errCopy(e));if(e&&e.fatal)return;continue}
    showReady();
  }
}
function keyUI(){const has=!!gKey(),toChrome=ONSITE&&ANDROID&&!INCHROME;keyIn.hidden=has||!ONSITE;siteLink.hidden=has||(ONSITE&&!toChrome);if(toChrome&&!has){siteLink.textContent='크롬으로 열기 ↗';siteLink.href='intent://'+location.host+location.pathname+'#Intent;scheme=https;package=com.android.chrome;end';siteLink.removeAttribute('target')}}
GVOICES.forEach(([v,n])=>{const o=document.createElement('option');o.value=v;o.textContent=n;gvSel.appendChild(o)});
gvSel.value=GVOICES.some(g=>g[0]===prefs.gv)?prefs.gv:'Leda';
gvSel.onchange=()=>{prefs.gv=gvSel.value;savePrefs();if(PLAY&&cur>=0)startNarr(cur);prefetch()};
function takeKey(){const m=keyIn.value.match(/AIza[0-9A-Za-z_\-]{30,}/);if(!m)return;prefs.gkey=m[0];savePrefs();keyIn.value='';setV('키를 저장했어요. 이 기기에서도 목소리가 나와요.');setTimeout(prefetch,600)}
keyIn.oninput=takeKey;keyIn.onchange=takeKey;

/* ---------- 자막 ---------- */
const whoEl=document.getElementById('who'),lineEl=document.getElementById('line');
const chipHTML=a=>`<span class="art" style="background:${ART[a][1]}">${ART[a][0]}</span>`;
function lockText(id){return `도장 출석 ${UNLOCK[id]}번이면 이 카드가 열려요! (지금 ${LINK?LINK.dj:0}번)`}
function sayOf(b){return b.say}
function setCap(b){
  whoEl.innerHTML=(b.who||[]).map(id=>`<b>${SP[id].n}</b><i>${SP[id].k}</i>${SP[id].arts.map(chipHTML).join('')}`).join('<i>&nbsp;vs&nbsp;</i>');

/* ---------- 재생 ---------- */
let gT=0,cur=-1,hold=0,SEEK=false,DIRTY=true,last=0,WL=null;
const pp=document.getElementById('pp'),big=document.getElementById('big'),bigt=document.getElementById('bigt'),seek=document.getElementById('seek'),tm=document.getElementById('tm'),rdBtn=document.getElementById('rd'),sndBtn=document.getElementById('snd'),fsBtn=document.getElementById('fs'),chapEl=document.getElementById('chap');
const beatAt=T=>{for(let i=SC.length-1;i>=0;i--)if(T>=SC[i].start)return i;return 0};
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function render(){
  const i=beatAt(gT),b=SC[i];LT=Math.min(b.dur,gT-b.start);
  if(i!==cur){cur=i;setCap(b);if(PLAY)startNarr(i);PLT=SEEK?LT:-.001;SEEK=false;markChap()}
  if(SEEK){PLT=LT;SEEK=false}
  X.setTransform(K,0,0,K,0,0);
  sky(b.bg==='night');
  const cam=b.cam,z=cam.z,cy=G-(G-H/2)/z;
  X.save();X.translate(W/2,H/2);X.scale(z,z);X.translate(-cam.x,-cy);
  world(b);
  if(b.props)b.props();
  for(const [id,F,o] of b.actors){
    const sp=SP[id],P=Object.assign({},samp(F,LT));
    if(o.walk&&LT>o.walk[0]&&LT<o.walk[1]){const s=Math.sin((LT-o.walk[0])*10);P.flh+=.45*s;P.blh-=.45*s;P.fah-=.35*s;P.bah+=.35*s;P.y-=Math.abs(s)*6}
    place(sp,P);const sil=false;
    if(o.clip){X.save();X.beginPath();X.rect(-3000,-3000,7000,G+10+3000);X.clip();drawBug(X,sp,P,IDLE,sil);X.restore()}else drawBug(X,sp,P,IDLE,sil);
    if(sil){X.save();X.font='40px "Black Han Sans","Jua",sans-serif';X.textAlign='center';X.fillStyle='#e6ff8c';X.strokeStyle=OUT;X.lineWidth=6;const hy=P.wy-(sp.L.hd+sp.hr+34)*sp.s;X.strokeText('?',P.wx,hy);X.fillText('?',P.wx,hy);X.restore()}
  }

function loop(now){
  const dt=Math.min(.05,last?(now-last)/1000:0);last=now;
  if(PLAY){
    IDLE+=dt;DIRTY=true;
    if(NARR.state==='wait'&&performance.now()-NARR.since<25000){setV('목소리 받아 오는 중…')}
    else{
      if(NARR.state==='wait'){NARR.state='done';setV('목소리가 늦어서 이 장면은 자막으로 봐요.')}
      const i=beatAt(gT),b=SC[i],end=b.start+b.dur,talking=NARR.state==='play'&&!AU.paused&&!AU.ended;let nt=gT+dt;
      if(nt>=end&&talking&&hold<15){hold+=dt;nt=end-.0005}else if(nt>=end)hold=0;
      if(nt>=TOTAL){nt=TOTAL-.0005;if(!(talking&&hold<15))stop(true)}

async function wake(){try{if(navigator.wakeLock)WL=await navigator.wakeLock.request('screen')}catch(e){WL=null}}
function play(){
  if(gT>=TOTAL-.01){gT=0;cur=-1}
  PLAY=true;const a=ac();if(a&&a.resume)a.resume().catch(()=>{});
  big.hidden=true;pp.textContent='❚❚';pp.setAttribute('aria-label','멈춤');
  if(cur>=0){if(NARR.beat!==cur)startNarr(cur);else if(NARR.state==='play'){const p=AU.play();if(p&&p.catch)p.catch(()=>{})}}wake();DIRTY=true;
}
function stop(ended){
  PLAY=false;try{AU.pause()}catch(e){}pp.textContent='▶';pp.setAttribute('aria-label','재생');
  if(ended){bigt.textContent='↻ 다시 보기';big.hidden=false}
  try{WL&&WL.release()}catch(e){}WL=null;DIRTY=true;
}
function jump(T){gT=Math.max(0,Math.min(TOTAL-.001,T));cur=-1;SEEK=true;hold=0;stopNarr();DIRTY=true}
pp.onclick=()=>PLAY?stop():play();
big.onclick=()=>play();
seek.oninput=()=>{jump(seek.value/1000*TOTAL)};
