<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2F6BE0">
<title>하준이 영어 도장 — Miss Lily Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --mat-blue: #2F6BE0; --mat-blue-deep: #1E4FB5; --mat-yellow: #F7C948; --mat-red: #E4493F;
    --ink: #14213D; --ink-soft: #4A5677; --paper: #EEF3FB; --panel: #FFFFFF; --line: #D6DFF0; --bubble-hajun: #FFF4CC;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#0F1A33; --panel:#1B2A4D; --ink:#F3F6FB; --ink-soft:#B7C2DC; --line:#2C3D66; --bubble-hajun:#3D3A1F; } }
  :root[data-theme="dark"] { --paper:#0F1A33; --panel:#1B2A4D; --ink:#F3F6FB; --ink-soft:#B7C2DC; --line:#2C3D66; --bubble-hajun:#3D3A1F; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: "Nunito", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; font-weight: 600; -webkit-font-smoothing: antialiased; }
  h1, .display { font-family: "Fredoka", "Nunito", "Apple SD Gothic Neo", system-ui, sans-serif; font-weight: 700; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 4px solid var(--mat-yellow); outline-offset: 2px; }
  a { color: var(--mat-blue); }
  [hidden] { display: none !important; }
  #app { min-height: 100%; display: flex; flex-direction: column; }

  #setup { max-width: 680px; width: 100%; margin: 0 auto; padding: 28px 20px 40px; }
  .belt { height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--mat-blue) 0 45%, var(--mat-yellow) 45% 70%, var(--mat-red) 70%); margin-bottom: 22px; }
  #setup h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 4px; line-height: 1.05; }
  .sub { color: var(--ink-soft); margin: 0 0 24px; }
  .field { margin-bottom: 18px; }
  .field label { display: block; margin-bottom: 8px; }
  .field input[type=text], .field input[type=password], .field select { width: 100%; font: inherit; font-size: 1.15rem; padding: 13px 15px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); color: var(--ink); }
  .field.key { padding: 16px; border-radius: 16px; background: var(--panel); border: 3px solid var(--mat-red); }
  .field.key.ok { border-color: #1E8E5A; }
  .field.key p { margin: 8px 0 0; color: var(--ink-soft); font-size: .95rem; line-height: 1.5; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { padding: 8px 14px; border-radius: 999px; background: var(--panel); border: 2px solid var(--line); }
  .row { display: flex; gap: 8px; }
  .row > * { min-width: 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ctl { padding: 10px 14px; border-radius: 12px; background: var(--panel); border: 2px solid var(--line); white-space: nowrap; }
  .go { width: 100%; margin-top: 8px; padding: 20px; border-radius: 20px; font-size: 1.5rem; background: var(--mat-blue); color: #fff; box-shadow: 0 6px 0 var(--mat-blue-deep); }
  .go:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--mat-blue-deep); }
  .go:disabled { opacity: .5; box-shadow: none; transform: none; }
  .diag { margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: var(--panel); border: 2px solid var(--line); font-size: .98rem; line-height: 1.6; }
  .diag .bad { color: var(--mat-red); }
  .diag .ok { color: #1E8E5A; }

  #play { flex: 1; display: flex; flex-direction: column; padding: 12px 16px 16px; gap: 12px; max-width: 1500px; width: 100%; margin: 0 auto; }
  .topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .stars { font-size: 1.5rem; line-height: 1; }
  .stars span { filter: grayscale(1); opacity: .3; }
  .stars span.on { filter: none; opacity: 1; }
  .state { padding: 8px 14px; border-radius: 999px; font-weight: 800; background: var(--panel); border: 2px solid var(--line); }
  .state.listening { background: var(--mat-yellow); border-color: var(--mat-yellow); color: #14213D; }
  .state.speaking { background: var(--mat-blue); border-color: var(--mat-blue); color: #fff; }
  .state.thinking { color: var(--ink-soft); }
  .spacer { flex: 1; }

  .board { display: grid; grid-template-columns: 1fr; gap: 12px; flex: 1; }
  @media (min-width: 900px) and (orientation: landscape) { .board { grid-template-columns: 4fr 6fr; } }
  .stage { background: var(--mat-blue); color: #fff; border-radius: 24px; padding: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 200px; position: relative; overflow: hidden; }
  .stage::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: var(--mat-yellow); }
  .emoji { font-size: clamp(3.6rem, 10vw, 7rem); line-height: 1.15; letter-spacing: .08em; }
  .emoji.bump span { display: inline-block; animation: bump .5s ease-out; }
  @keyframes bump { 40% { transform: translateY(-14px) rotate(-6deg) } }
  .caption { font-size: clamp(1.1rem, 2.4vw, 1.5rem); margin-top: 12px; font-weight: 800; }
  @media (prefers-reduced-motion: reduce) { .emoji.bump span { animation: none } }

  .talk { display: flex; flex-direction: column; gap: 12px; }
  .bubble { border-radius: 22px; padding: 18px 22px; background: var(--panel); border: 3px solid var(--line); }
  .bubble.teacher { border-color: var(--mat-blue); }
  .bubble.hajun { background: var(--bubble-hajun); border-color: var(--mat-yellow); min-height: 96px; }
  .who { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; color: var(--ink-soft); }
  .who .face { font-size: 1.7rem; }
  .line { font-family: "Fredoka", "Nunito", system-ui, sans-serif; font-weight: 600; font-size: clamp(1.5rem, 3.4vw, 2.5rem); line-height: 1.3; min-height: 1.3em; }
  .line .interim { color: var(--ink-soft); }
  .raw { color: var(--ink-soft); font-size: 1.05rem; margin-top: 8px; }
  .fix { color: #1E8E5A; }
  .thinking-dots::after { content: "…"; animation: blink 1s steps(3) infinite; }
  @keyframes blink { 50% { opacity: .2 } }

  .bottom { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .big { padding: 16px 22px; border-radius: 18px; font-size: 1.25rem; font-weight: 800; background: var(--panel); border: 3px solid var(--line); }
  .big.primary { background: var(--mat-red); color: #fff; border-color: var(--mat-red); box-shadow: 0 5px 0 #B23127; }
  .status { color: var(--ink-soft); min-height: 1.4em; }
  .status.err { color: var(--mat-red); font-weight: 800; }
</style>
</head>
<body>
<div id="app">
  <section id="setup">
    <div class="belt" aria-hidden="true"></div>
    <h1>하준이 영어 도장</h1>
    <p class="sub">Miss Lily와 라이브로 말하기 · 하준이가 말한 문장을 바른 영어로 고쳐서 먼저 들려주고, 그다음 대답해요</p>

    <div class="field key" id="apiField" hidden>
      <label for="apiKey">① Miss Lily 두뇌 — 무료로 쓰려면 Gemini 키를 넣어요</label>
      <div class="row" style="margin-bottom:8px">
        <select id="provider" class="ctl" style="flex:1;padding:10px">
          <option value="gemini" selected>Google Gemini (무료)</option>
          <option value="anthropic">Anthropic Claude (유료)</option>
        </select>
        <select id="model" class="ctl" style="flex:1;padding:10px"></select>
      </div>
      <input id="apiKey" type="password" placeholder="API 키 붙여넣기" autocomplete="off">
      <p id="keyHelp"></p>
    </div>

    <div class="field">
      <label for="interest">② 오늘 주제 (한글로 써도 돼요)</label>
      <input id="interest" type="text" placeholder="예: 사마귀, 유도 vs 태권도, 매미, 우주" autocomplete="off">
      <div class="chips" id="chips">
        <button class="chip" type="button">유도 vs 태권도</button>
        <button class="chip" type="button">주짓수 대결</button>
        <button class="chip" type="button">레슬링 챔피언</button>
        <button class="chip" type="button">사마귀</button>
        <button class="chip" type="button">매미</button>
        <button class="chip" type="button">우주 탐험</button>
      </div>
    </div>

    <div class="field">
      <label for="voiceSource">③ Miss Lily 목소리</label>
      <select id="voiceSource" style="margin-bottom:8px">
        <option value="phone" selected>폰 내장 목소리 (무료)</option>
        <option value="gemini">Gemini 원어민 목소리 (사람 같음 · Gemini 키 + 결제 등록 필요)</option>
      </select>
      <div class="row" id="phoneVoiceRow">
        <select id="voice" style="flex:1"></select>
        <button class="ctl" id="testVoice" type="button">🔊 테스트</button>
      </div>
      <div class="row" id="geminiVoiceRow" hidden>
        <select id="gVoice" style="flex:1">
          <option value="Sulafat" selected>Sulafat — 따뜻한 여성</option>
          <option value="Leda">Leda — 젊은 여성</option>
          <option value="Aoede">Aoede — 산뜻한 여성</option>
          <option value="Zephyr">Zephyr — 밝은 여성</option>
          <option value="Achird">Achird — 친근한</option>
          <option value="Kore">Kore — 또렷한 여성</option>
        </select>
        <button class="ctl" id="testGVoice" type="button">🔊 테스트</button>
      </div>
      <p class="note" id="voiceNote" style="margin:8px 0 0;color:var(--ink-soft);font-size:.95rem;line-height:1.5"></p>
    </div>

    <div class="field">
      <label for="listenEngine">④ 하준이 말 알아듣기 (음성 인식)</label>
      <select id="listenEngine">
        <option value="phone" selected>폰 내장 인식 (무료 · 빠름 · 정확도 보통)</option>
        <option value="gemini">Gemini가 직접 듣기 (정확 · 아이 발음·한국어 섞여도 OK · Gemini 키)</option>
      </select>
    </div>

    <div class="grid2">
      <div class="field">
        <label for="silence">말 멈춘 뒤 기다리는 시간</label>
        <select id="silence">
          <option value="3000">3초</option>
          <option value="5000" selected>5초</option>
          <option value="7000">7초</option>
          <option value="10000">10초</option>
        </select>
      </div>
      <div class="field">
        <label for="tvDelay">TV로 소리 나갈 때 지연 보정</label>
        <select id="tvDelay">
          <option value="600">없음 (폰 스피커)</option>
          <option value="1500" selected>보통 (미러링)</option>
          <option value="2500">큼 (소리가 늦게 나오면)</option>
        </select>
      </div>
      <div class="field">
        <label for="rate">말 속도</label>
        <select id="rate">
          <option value="0.9">조금 천천히</option>
          <option value="1" selected>보통</option>
          <option value="1.1">빠르게</option>
        </select>
      </div>
    </div>

    <button class="go display" id="start" type="button">이야기 시작!</button>
    <div class="diag" id="diag">확인 중…</div>
  </section>

  <section id="play" hidden>
    <div class="topbar">
      <div class="stars" id="stars"></div>
      <span id="topic" style="color:var(--ink-soft)"></span>
      <span class="spacer"></span>
      <span class="state" id="stateChip">준비</span>
      <button class="ctl" id="replay" type="button">🔁 다시 듣기</button>
      <button class="ctl" id="quit" type="button">⏹ 끝내기</button>
    </div>

    <div class="board">
      <div class="stage">
        <div class="emoji" id="emoji">🥋</div>
        <div class="caption" id="caption"></div>
      </div>
      <div class="talk">
        <div class="bubble hajun">
          <div class="who"><span class="face">🧒</span> Hajun <span id="countdown" style="margin-left:auto"></span></div>
          <div class="line" id="hajunLine"></div>
          <div id="meter" hidden style="height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:6px"><div id="meterBar" style="height:100%;width:0;background:var(--mat-blue);transition:width .08s"></div></div>
          <div class="raw" id="hajunRaw" hidden></div>
        </div>
        <div class="bubble teacher" id="teacherBubble">
          <div class="who"><span class="face">👩‍🏫</span> Miss Lily</div>
          <div class="line" id="teacherLine"></div>
        </div>
      </div>
    </div>

    <div class="bottom">
      <button class="big primary" id="pause" type="button">⏸ 잠깐 멈춤</button>
      <button class="big" id="sendNow" type="button">✅ 지금 대답 보내기</button>
      <span class="status" id="status"></span>
    </div>
  </section>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  const RULES = `You are Miss Lily, a warm, playful American English teacher having a LIVE spoken conversation with Hajun, a 7-year-old Korean boy. Everything you write is read aloud by a text-to-speech voice, so write exactly how a friendly American teacher TALKS to a kid: contractions, short sentences, natural rhythm ("Whoa!", "No way!", "Okay, okay…").

Hajun understands English well but is shy about speaking and needs time to build sentences. His words come from a speech recognizer, so they may be broken, repeated, or partly Korean. Your job: keep him talking, and let him hear the correct sentence every time.

STORY: You and Hajun build a cartoon adventure together from TODAY'S INTEREST. Create 2-3 characters (animals, bugs, robots, or kids) with fun names. They train, race, and have friendly matches. Energetic and funny, cartoon-safe: nobody gets hurt ("bonk!", "oops!", "they both laugh"). Hajun's answers change what happens next. Roughly every 10 exchanges, wrap up the episode happily and start a fresh one — you can ask Hajun what should happen next.

EACH TURN, output two things:
1. "fix" = what Hajun just said, rewritten as ONE short, correct, natural English sentence a 7-year-old would say (max 10 words). Keep his meaning and his words where possible. If he said several things, keep the main one. If he spoke Korean, translate it into simple English. If nothing is understandable, use "". On the very first turn use "". This sentence is played to him slowly so he can repeat it.
2. "say" = your reply. Start by cheering the idea ("Yes! The tiger is really big!"). Never say "wrong". Then move the story ONE small step. End with exactly ONE simple question he can answer in a few words (who / what / which / do you like / what happens next / yes-no). At most 3 short sentences plus the question — around 25 words.
- If told Hajun was quiet, gently get his attention and ask an easier yes/no question.

Reply with ONLY this JSON, nothing else:
{"fix":"<corrected sentence or empty>","say":"<everything Miss Lily says>","emoji":"<2-4 emoji separated by spaces>","scene":"<caption, max 8 words>"}`;

  // ---------- prefs ----------
  const prefs = (() => { try { return JSON.parse(localStorage.getItem("dojo-live") || "{}"); } catch { return {}; } })();
  const save = () => { try { localStorage.setItem("dojo-live", JSON.stringify(prefs)); } catch {} };

  // ---------- state ----------
  let turns = [];
  let stars = 0;
  let state = "idle";           // idle | thinking | speaking | listening | paused
  let wantListening = false;
  let lastSpoken = "";
  let ctl = null;
  let mode = null;              // "claude" | "api"
  let sample = null;

  const SILENCE = () => Number($("silence").value) || 5000;
  const NUDGE_MS = 25000;
  const apiKey = () => $("apiKey").value.trim();

  // ---------- brain ----------
  function parseJSON(text) {
    try { return JSON.parse(text); } catch {}
    const m = text.match(/\{[\s\S]*\}/);
    if (m) { try { return JSON.parse(m[0]); } catch {} }
    return { fix: "", say: text.replace(/[{}"]/g, "").slice(0, 300), emoji: "🥋", scene: "" };
  }
  const MODELS = {
    gemini: [["gemini-3.5-flash-lite", "3.5 Flash-Lite (무료 넉넉, 기본)"], ["gemini-3.8-flash", "3.8 Flash (무료는 하루 20번뿐)"]],
    anthropic: [["claude-haiku-4-5-20251001", "Haiku 4.5 (빠름)"], ["claude-sonnet-5", "Sonnet 5"]]
  };
  const KEY_HELP = {
    gemini: '무료: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> → 구글 로그인 → Create API key → 복사. 카드 등록 없이 하루 수백 번은 돼요. (무료 구간은 구글이 대화 내용을 품질 개선에 쓸 수 있어요)',
    anthropic: '유료: <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com → API Keys</a>. Billing 충전이 필요해요.'
  };
  function provider() { return $("provider").value; }
  function fillModels() {
    const sel = $("model"); sel.innerHTML = "";
    MODELS[provider()].forEach(([v, l]) => sel.append(new Option(l, v)));
    const saved = prefs["model_" + provider()];
    if (saved && MODELS[provider()].some(m => m[0] === saved)) sel.value = saved;
    $("keyHelp").innerHTML = KEY_HELP[provider()];
    $("apiKey").placeholder = provider() === "gemini" ? "AIza… 로 시작하는 키 붙여넣기" : "sk-ant-… 로 시작하는 키 붙여넣기";
    $("apiKey").value = prefs["key_" + provider()] || "";
  }
  async function brain(msgs, signal) {
    if (mode === "claude") {
      return sample.json([{ role: "user", content: RULES }, ...msgs], { modelTier: "quick", cache: false, signal });
    }
    const key = apiKey();
    if (!key) throw { code: "no_key" };
    if (provider() === "gemini") return geminiCall(msgs, key, signal, true);
    const r = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST", signal,
      headers: { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: $("model").value, max_tokens: 300, system: RULES, messages: msgs })
    });
    if (r.status === 401 || r.status === 403) throw { code: "bad_key" };
    if (r.status === 429) throw { code: "rate_limited" };
    if (r.status === 400) { const j = await r.json().catch(() => ({})); throw { code: /credit|billing/i.test(JSON.stringify(j)) ? "no_credit" : "upstream_error" }; }
    if (!r.ok) throw { code: "upstream_error", message: String(r.status) };
    const data = await r.json();
    const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
    return parseJSON(text);
  }
  async function geminiCall(msgs, key, signal, withThinking) {
    const model = $("model").value;
    const generationConfig = { responseMimeType: "application/json", maxOutputTokens: 600, temperature: 0.9 };
    if (withThinking) generationConfig.thinkingConfig = { thinkingLevel: "minimal" };
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
      method: "POST", signal,
      headers: { "content-type": "application/json", "x-goog-api-key": key },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: RULES }] },
        contents: msgs.map(m => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }] })),
        generationConfig
      })
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      const msg = JSON.stringify(j);
      if (r.status === 429 || /RESOURCE_EXHAUSTED/.test(msg)) throw { code: "rate_limited" };
      if (r.status === 401 || r.status === 403 || /API key not valid|API_KEY_INVALID|PERMISSION_DENIED/i.test(msg)) throw { code: "bad_key" };
      if (r.status === 400 && withThinking) return geminiCall(msgs, key, signal, false);   // model didn't accept the thinking option
      throw { code: "upstream_error", message: String(r.status) };
    }
    const data = await r.json();
    const text = (((data.candidates || [])[0] || {}).content || {}).parts?.map(p => p.text || "").join("") || "";
    if (!text) throw { code: "empty_completion" };
    return parseJSON(text);
  }

  // ---------- voices ----------
  const synth = window.speechSynthesis;
  let voices = [];
  const isEn = (v) => /^en[-_]/i.test(v.lang);
  function loadVoices() {
    if (!synth) return false;
    const all = synth.getVoices();
    if (!all.length) return false;
    voices = all.filter(isEn);
    const sel = $("voice"); sel.innerHTML = "";
    if (!voices.length) { sel.append(new Option("영어 원어민 목소리 없음", "")); return true; }
    const rank = (v) => {
      const n = v.name, us = /en[-_]US/i.test(v.lang);
      if (/Natural/i.test(n) && us && /Aria|Jenny|Ava|Emma|Michelle/i.test(n)) return 0;
      if (/Natural/i.test(n) && us) return 1;
      if (/Natural/i.test(n)) return 2;
      if (/Samantha|Ava|Allison/.test(n) && us) return 3;
      if (/network/i.test(n) && us) return 3;
      if (/Google US English/.test(n)) return 4;
      if (us) return 5;

    echoRef = say; fixRef = fix;
    prefetchSpeech(fix, say);
    setState("speaking");
    // 1) play back Hajun's sentence, corrected, a touch slower  2) then Miss Lily's reply
    const after = () => { if (wantListening) setTimeout(startListening, TV_DELAY()); else setState("paused"); };
    const sayLily = () => { $("teacherLine").textContent = say; lastSpoken = say; speak(say, after, 1, "say"); };
    if (fix) {
      $("hajunLine").innerHTML = ""; const s = document.createElement("span"); s.className = "fix"; s.textContent = "✔ " + fix; $("hajunLine").append(s);
      if (lastRaw && lastRaw.toLowerCase() !== fix.toLowerCase()) { $("hajunRaw").hidden = false; $("hajunRaw").textContent = "들린 말: " + lastRaw; }
      $("teacherLine").textContent = "";
      speak(fix, () => setTimeout(sayLily, 350), 0.9, "fix");
    } else sayLily();
  }

  // ---------- ui helpers ----------
  function setState(s) {
    state = s;
    const chip = $("stateChip"); chip.className = "state " + s;
    chip.textContent = { listening: "👂 하준이 차례", thinking: "🤔 생각 중", speaking: "🗣 Miss Lily", paused: "⏸ 멈춤", idle: "준비" }[s] || s;
    $("pause").textContent = (s === "paused") ? "▶ 다시 시작" : "⏸ 잠깐 멈춤";
  }
  function setStatus(msg, err) { const s = $("status"); s.className = "status" + (err ? " err" : ""); s.textContent = msg || ""; }
  function renderStars() { const el = $("stars"); el.innerHTML = ""; for (let i = 0; i < Math.max(8, stars); i++) { const s = document.createElement("span"); s.textContent = "⭐"; if (i < stars) s.classList.add("on"); el.append(s); } }

  // ---------- wiring ----------
  $("chips").addEventListener("click", (e) => { const b = e.target.closest(".chip"); if (b) $("interest").value = b.textContent; });
  $("voice").addEventListener("change", () => { prefs.voice = $("voice").value; save(); });
  ["silence", "rate", "tvDelay", "listenEngine"].forEach(id => { if (prefs[id]) $(id).value = prefs[id]; $(id).addEventListener("change", () => { prefs[id] = $(id).value; save(); }); });
  if (prefs.provider) $("provider").value = prefs.provider;
  fillModels();
  $("provider").addEventListener("change", () => { prefs.provider = provider(); save(); fillModels(); setDiag(); });
  $("listenEngine").addEventListener("change", setDiag);
  $("model").addEventListener("change", () => { prefs["model_" + provider()] = $("model").value; save(); });
  ["input", "change"].forEach(ev => $("apiKey").addEventListener(ev, () => { prefs["key_" + provider()] = apiKey(); save(); setDiag(); }));
  $("testVoice").addEventListener("click", () => { loadVoices(); if (!currentVoice()) { setDiag(); return; } speakPhone("Hey Hajun! I'm Miss Lily. Are you ready to play?"); });
  function applyVoiceSource() {
    const g = $("voiceSource").value === "gemini";
    $("phoneVoiceRow").hidden = g; $("geminiVoiceRow").hidden = !g;
    $("voiceNote").textContent = g ? "Google AI Studio에서 결제(카드)를 등록한 키여야 돼요. 1분에 12원 정도라 30분 놀면 400원쯤이에요. 실패하면 자동으로 폰 목소리로 넘어가요." : "폰 설정 → 텍스트 음성 변환에서 Google 음성 서비스 + 영어(미국) 고품질 음성을 설치하면 덜 기계 같아요.";
    setDiag();
  }
  if (prefs.voiceSource) $("voiceSource").value = prefs.voiceSource;
  if (prefs.gVoice) $("gVoice").value = prefs.gVoice;
  $("voiceSource").addEventListener("change", () => { prefs.voiceSource = $("voiceSource").value; save(); geminiTtsBroken = false; applyVoiceSource(); });
  $("gVoice").addEventListener("change", () => { prefs.gVoice = $("gVoice").value; save(); });
  $("testGVoice").addEventListener("click", async () => {
    geminiTtsBroken = false;
    $("voiceNote").textContent = "목소리 가져오는 중…";
    try { player.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA="; await player.play().catch(() => {}); } catch {}
    try { const b = await geminiTtsFetch("Hey Hajun! I'm Miss Lily. Are you ready to play?", TTS_STYLE_LILY); await playBlob(b); $("voiceNote").textContent = "✔ Gemini 목소리가 돼요."; }
    catch (e) { $("voiceNote").textContent = e && e.code === "no_key" ? "Gemini 키가 없어요. ① 칸에 Gemini 키를 넣어 주세요." : e && e.code === "rate_limited" ? "한도에 걸렸어요. 결제 미등록이면 무료 한도가 거의 없어요 — aistudio.google.com에서 Billing 등록 후 다시 눌러 보세요." : "실패했어요: " + ((e && e.message) || "").slice(0, 120); }
  });
  applyVoiceSource();
  $("replay").addEventListener("click", () => { if (state === "listening") stopListening(); setState("speaking"); speak(lastSpoken, () => { if (wantListening) setTimeout(startListening, TV_DELAY()); }); });
  $("pause").addEventListener("click", () => {
    if (state === "paused") { wantListening = true; startListening(); }
    else { wantListening = false; stopListening(); synth && synth.cancel(); ctl && ctl.abort(); setState("paused"); }
  });
  $("sendNow").addEventListener("click", () => {
    const retry = $("sendNow").dataset.retry;
    if (retry && state === "paused") { delete $("sendNow").dataset.retry; wantListening = true; ask(retry); return; }
    if (listenEngine() === "gemini") { if (state === "listening" && gCap.speaking) finalizeCapture(); return; }
    const t = fullText();
    if (state === "listening" && t) sendTurn(t, false);
  });
  $("quit").addEventListener("click", () => { wantListening = false; stopListening(); synth && synth.cancel(); ctl && ctl.abort(); setState("idle"); $("play").hidden = true; $("setup").hidden = false; });

  $("start").addEventListener("click", async () => {
    if (mode === "api" && !apiKey()) { $("apiKey").focus(); setDiag(); return; }
    if (listenEngine() === "gemini") {
      const ok = await ensureMic();
      if (!ok) { $("listenEngine").value = "phone"; setStatus("마이크를 못 열어서 폰 인식으로 시작해요.", true); }
    }
    const interest = $("interest").value.trim() || "유도 vs 태권도";
    if (synth) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; synth.speak(u); }
    try { player.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA="; player.play().catch(() => {}); } catch {}
    geminiTtsBroken = false;
    turns = []; stars = 0; renderStars(); committed = ""; session = ""; interimText = ""; lastRaw = ""; renderHajun(); $("hajunRaw").hidden = true;
    $("topic").textContent = "오늘 주제: " + interest;
    $("setup").hidden = true; $("play").hidden = false;
    wantListening = true;
    ask(`NEW STORY. Today's interest: ${interest}. Say hi to Hajun, introduce the characters in one breath, start the action, and ask your first easy question.`);
  });

  // ---------- diagnostics ----------
  function setDiag() {
    const v = currentVoice();
    const lines = [];
    if (mode === "claude") lines.push(`<span class="ok">✔ Miss Lily 두뇌: Claude 연결됨</span>`);
    else if (mode === "api") { const ok = !!apiKey(); $("apiField").classList.toggle("ok", ok); lines.push(ok ? `<span class="ok">✔ Miss Lily 두뇌: ${provider() === "gemini" ? "Gemini (무료)" : "Claude"} 키 있음</span>` : `<span class="bad">✘ API 키가 없어요 — 위 ① 칸에 붙여넣어야 Miss Lily가 말해요</span>`); }
    else lines.push(`<span class="bad">✘ 두뇌 연결 확인 중…</span>`);
    const gListen = $("listenEngine").value === "gemini";
    if (gListen) lines.push(navigator.mediaDevices ? `<span class="ok">✔ 듣기: Gemini가 직접 (마이크 허용 창이 한 번 떠요)</span>` : `<span class="bad">✘ 이 브라우저는 마이크 녹음이 안 돼요</span>`);
    else lines.push(SR ? `<span class="ok">✔ 듣기: 폰 내장 인식</span>` : `<span class="bad">✘ 이 브라우저는 음성 인식이 안 돼요 — 크롬으로 열어 주세요</span>`);
    const phoneVoiceNeeded = $("voiceSource").value !== "gemini";
    if (!phoneVoiceNeeded) lines.push(`<span class="ok">✔ 목소리: Gemini ${$("gVoice").value} (안 되면 폰 목소리로 자동 전환)</span>`);
    else if (!synth) lines.push(`<span class="bad">✘ 음성 엔진 없음</span>`);
    else if (!v) lines.push(`<span class="bad">✘ 영어 원어민 목소리가 없어요 — 폰 설정 → 일반 → 텍스트 음성 변환에서 영어(미국) 음성 데이터를 설치해 주세요</span>`);
    else lines.push(`<span class="ok">✔ 목소리: ${v.name}</span>` + (/Android/i.test(navigator.userAgent) && !/network|Google/i.test(v.name) ? ` — 폰 설정 → 텍스트 음성 변환에서 "Google 음성 서비스"를 기본으로 하고 영어(미국) 고품질 음성을 설치하면 더 자연스러워요` : ""));
    $("diag").innerHTML = lines.join("<br>");
    $("start").disabled = !(mode && (gListen ? !!navigator.mediaDevices : SR) && (v || !phoneVoiceNeeded) && (mode !== "api" || apiKey()));
  }
  if (synth) {
    $("voice").append(new Option("목소리 찾는 중…", ""));
    synth.onvoiceschanged = () => { loadVoices(); setDiag(); };
    let tries = 0; const poll = () => { if (loadVoices() || tries++ > 16) { setDiag(); return; } setTimeout(poll, 250); }; poll();
  } else { $("voice").append(new Option("음성 엔진 없음", "")); }

  (async () => {
    if (window.claude && typeof window.claude.use === "function") sample = await window.claude.use("sample");
    if (sample) mode = "claude";
    else { mode = "api"; $("apiField").hidden = false; }
    setDiag();
  })();
})();
</script>
</body>
</html>
