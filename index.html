<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2F6BE0">
<title>하준이 영어 도장 — Miss Lily Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --mat-blue: #2F6BE0; --mat-blue-deep: #1E4FB5; --mat-yellow: #F7C948; --mat-red: #E4493F;
    --ink: #14213D; --ink-soft: #4A5677; --paper: #EEF3FB; --panel: #FFFFFF; --line: #D6DFF0; --bubble-hajun: #FFF4CC;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#0F1A33; --panel:#1B2A4D; --ink:#F3F6FB; --ink-soft:#B7C2DC; --line:#2C3D66; --bubble-hajun:#3D3A1F; } }
  :root[data-theme="dark"] { --paper:#0F1A33; --panel:#1B2A4D; --ink:#F3F6FB; --ink-soft:#B7C2DC; --line:#2C3D66; --bubble-hajun:#3D3A1F; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: "Nunito", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; font-weight: 600; -webkit-font-smoothing: antialiased; }
  h1, .display { font-family: "Fredoka", "Nunito", "Apple SD Gothic Neo", system-ui, sans-serif; font-weight: 700; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 4px solid var(--mat-yellow); outline-offset: 2px; }
  [hidden] { display: none !important; }
  #app { min-height: 100%; display: flex; flex-direction: column; }

  #setup { max-width: 680px; width: 100%; margin: 0 auto; padding: 28px 20px 40px; }
  .belt { height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--mat-blue) 0 45%, var(--mat-yellow) 45% 70%, var(--mat-red) 70%); margin-bottom: 22px; }
  #setup h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 4px; line-height: 1.05; }
  .sub { color: var(--ink-soft); margin: 0 0 24px; }
  .field { margin-bottom: 18px; }
  .field label { display: block; margin-bottom: 8px; }
  .field input[type=text], .field input[type=password], .field select { width: 100%; font: inherit; font-size: 1.15rem; padding: 13px 15px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { padding: 8px 14px; border-radius: 999px; background: var(--panel); border: 2px solid var(--line); }
  .row { display: flex; gap: 8px; }
  .row > * { min-width: 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ctl { padding: 10px 14px; border-radius: 12px; background: var(--panel); border: 2px solid var(--line); white-space: nowrap; }
  .go { width: 100%; margin-top: 8px; padding: 20px; border-radius: 20px; font-size: 1.5rem; background: var(--mat-blue); color: #fff; box-shadow: 0 6px 0 var(--mat-blue-deep); }
  .go:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--mat-blue-deep); }
  .go:disabled { opacity: .5; box-shadow: none; transform: none; }
  .diag { margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: var(--panel); border: 2px solid var(--line); font-size: .98rem; line-height: 1.6; }
  .diag .bad { color: var(--mat-red); }
  .diag .ok { color: #1E8E5A; }

  #play { flex: 1; display: flex; flex-direction: column; padding: 12px 16px 16px; gap: 12px; max-width: 1500px; width: 100%; margin: 0 auto; }
  .topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .stars { font-size: 1.5rem; line-height: 1; }
  .stars span { filter: grayscale(1); opacity: .3; }
  .stars span.on { filter: none; opacity: 1; }
  .state { padding: 8px 14px; border-radius: 999px; font-weight: 800; background: var(--panel); border: 2px solid var(--line); }
  .state.listening { background: var(--mat-yellow); border-color: var(--mat-yellow); color: #14213D; }
  .state.speaking { background: var(--mat-blue); border-color: var(--mat-blue); color: #fff; }
  .state.thinking { color: var(--ink-soft); }
  .spacer { flex: 1; }

  .board { display: grid; grid-template-columns: 1fr; gap: 12px; flex: 1; }
  @media (min-width: 900px) and (orientation: landscape) { .board { grid-template-columns: 4fr 6fr; } }
  .stage { background: var(--mat-blue); color: #fff; border-radius: 24px; padding: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 240px; position: relative; overflow: hidden; }
  .stage::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: var(--mat-yellow); }
  .emoji { font-size: clamp(3.6rem, 10vw, 7rem); line-height: 1.15; letter-spacing: .08em; }
  .emoji.bump span { display: inline-block; animation: bump .5s ease-out; }
  @keyframes bump { 40% { transform: translateY(-14px) rotate(-6deg) } }
  .caption { font-size: clamp(1.1rem, 2.4vw, 1.5rem); margin-top: 12px; font-weight: 800; }
  @media (prefers-reduced-motion: reduce) { .emoji.bump span { animation: none } }

  .talk { display: flex; flex-direction: column; gap: 12px; }
  .bubble { border-radius: 22px; padding: 18px 22px; background: var(--panel); border: 3px solid var(--line); }
  .bubble.teacher { border-color: var(--mat-blue); }
  .bubble.hajun { background: var(--bubble-hajun); border-color: var(--mat-yellow); min-height: 96px; }
  .who { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; color: var(--ink-soft); }
  .who .face { font-size: 1.7rem; }
  .line { font-family: "Fredoka", "Nunito", system-ui, sans-serif; font-weight: 600; font-size: clamp(1.5rem, 3.4vw, 2.5rem); line-height: 1.3; min-height: 1.3em; }
  .line .interim { color: var(--ink-soft); }
  .thinking-dots::after { content: "…"; animation: blink 1s steps(3) infinite; }
  @keyframes blink { 50% { opacity: .2 } }

  .bottom { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .big { padding: 16px 22px; border-radius: 18px; font-size: 1.25rem; font-weight: 800; background: var(--panel); border: 3px solid var(--line); }
  .big.primary { background: var(--mat-red); color: #fff; border-color: var(--mat-red); box-shadow: 0 5px 0 #B23127; }
  .status { color: var(--ink-soft); min-height: 1.4em; }
  .status.err { color: var(--mat-red); font-weight: 800; }
</style>
</head>
<body>
<div id="app">
  <section id="setup">
    <div class="belt" aria-hidden="true"></div>
    <h1>하준이 영어 도장</h1>
    <p class="sub">Miss Lily와 라이브로 말하기 · 마이크는 계속 켜져 있고, 하준이가 말을 멈추면 정해진 시간만큼 기다렸다가 Miss Lily가 대답해요</p>

    <div class="field">
      <label for="interest">오늘 주제 (한글로 써도 돼요)</label>
      <input id="interest" type="text" placeholder="예: 사마귀, 유도 vs 태권도, 매미, 우주" autocomplete="off">
      <div class="chips" id="chips">
        <button class="chip" type="button">유도 vs 태권도</button>
        <button class="chip" type="button">주짓수 대결</button>
        <button class="chip" type="button">레슬링 챔피언</button>
        <button class="chip" type="button">사마귀</button>
        <button class="chip" type="button">매미</button>
        <button class="chip" type="button">우주 탐험</button>
      </div>
    </div>

    <div class="field">
      <label for="voice">Miss Lily 목소리 (영어 원어민 목소리만 보여요)</label>
      <div class="row">
        <select id="voice" style="flex:1"></select>
        <button class="ctl" id="testVoice" type="button">🔊 테스트</button>
      </div>
    </div>

    <div class="grid2">
      <div class="field">
        <label for="silence">하준이가 말 멈춘 뒤 기다리는 시간</label>
        <select id="silence">
          <option value="3000">3초</option>
          <option value="5000" selected>5초</option>
          <option value="7000">7초</option>
          <option value="10000">10초</option>
        </select>
      </div>
      <div class="field">
        <label for="rate">말 속도</label>
        <select id="rate">
          <option value="0.9">조금 천천히</option>
          <option value="1" selected>보통 (미국 아이와 대화 속도)</option>
          <option value="1.1">빠르게</option>
        </select>
      </div>
    </div>

    <div class="field" id="apiField" hidden>
      <label for="apiKey">Anthropic API 키 (이 브라우저에만 저장돼요)</label>
      <div class="row">
        <input id="apiKey" type="password" placeholder="sk-ant-…" autocomplete="off" style="flex:1">
        <select id="model" class="ctl" style="padding:10px">
          <option value="claude-haiku-4-5-20251001" selected>Haiku (빠름)</option>
          <option value="claude-sonnet-5">Sonnet 5</option>
        </select>
      </div>
    </div>

    <button class="go display" id="start" type="button">이야기 시작!</button>
    <div class="diag" id="diag">확인 중…</div>
  </section>

  <section id="play" hidden>
    <div class="topbar">
      <div class="stars" id="stars"></div>
      <span id="topic" style="color:var(--ink-soft)"></span>
      <span class="spacer"></span>
      <span class="state" id="stateChip">준비</span>
      <button class="ctl" id="replay" type="button">🔁 다시 듣기</button>
      <button class="ctl" id="quit" type="button">⏹ 끝내기</button>
    </div>

    <div class="board">
      <div class="stage">
        <div class="emoji" id="emoji">🥋</div>
        <div class="caption" id="caption"></div>
      </div>
      <div class="talk">
        <div class="bubble teacher" id="teacherBubble">
          <div class="who"><span class="face">👩‍🏫</span> Miss Lily</div>
          <div class="line" id="teacherLine"></div>
        </div>
        <div class="bubble hajun">
          <div class="who"><span class="face">🧒</span> Hajun <span id="countdown" style="margin-left:auto"></span></div>
          <div class="line" id="hajunLine"></div>
        </div>
      </div>
    </div>

    <div class="bottom">
      <button class="big primary" id="pause" type="button">⏸ 잠깐 멈춤</button>
      <button class="big" id="sendNow" type="button">✅ 지금 대답 보내기</button>
      <span class="status" id="status"></span>
    </div>
  </section>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  const RULES = `You are Miss Lily, a warm, playful American English teacher having a LIVE spoken conversation with Hajun, a 7-year-old Korean boy. Everything you write will be read aloud by a text-to-speech voice, so write exactly how a friendly American teacher TALKS to a kid: contractions, short sentences, natural rhythm ("Whoa!", "No way!", "Okay, okay…").

Hajun understands English well but is shy about speaking and needs time to build sentences. Your job is to keep him talking and having fun.

STORY: You and Hajun build a cartoon adventure together from TODAY'S INTEREST. Create 2-3 characters (animals, bugs, robots, or kids) with fun names. They train, race, and have friendly matches. Energetic and funny, cartoon-safe: nobody gets hurt ("bonk!", "oops!", "they both laugh"). Hajun's answers change what happens next. Roughly every 10 exchanges, wrap up the episode happily and start a fresh one — you can ask Hajun what should happen next.

EACH TURN:
- First react to what Hajun just said. Repeat his idea back in correct, natural English. Never say "wrong". If he speaks Korean or the words are garbled, cheer and model the English version ("Ohh, you mean the tiger jumps? Yes!").
- Then move the story ONE small step.
- End with exactly ONE simple question he can answer in a few words (who / what / which / do you like / what happens next / yes-no). Give a tiny nudge if useful: "You can say: Tiger wins!"
- Total: at most 3 short sentences plus the question. Around 25 words.
- If told Hajun was quiet, gently get his attention and ask an easier yes/no question.

Reply with ONLY this JSON, nothing else:
{"say":"<everything Miss Lily says, in one string>","emoji":"<2-4 emoji separated by spaces>","scene":"<caption, max 8 words>"}`;

  // ---------- prefs ----------
  const prefs = (() => { try { return JSON.parse(localStorage.getItem("dojo-live") || "{}"); } catch { return {}; } })();
  const save = () => { try { localStorage.setItem("dojo-live", JSON.stringify(prefs)); } catch {} };

  // ---------- state ----------
  let turns = [];
  let stars = 0;
  let state = "idle";           // idle | thinking | speaking | listening | paused
  let wantListening = false;
  let lastSpoken = "";
  let ctl = null;
  let mode = null;              // "claude" | "api"
  let sample = null;

  const SILENCE = () => Number($("silence").value) || 5000;
  const NUDGE_MS = 25000;

  // ---------- brain ----------
  function parseJSON(text) {
    try { return JSON.parse(text); } catch {}
    const m = text.match(/\{[\s\S]*\}/);
    if (m) { try { return JSON.parse(m[0]); } catch {} }
    return { say: text.replace(/[{}"]/g, "").slice(0, 300), emoji: "🥋", scene: "" };
  }
  async function brain(msgs, signal) {
    if (mode === "claude") {
      return sample.json([{ role: "user", content: RULES }, ...msgs], { modelTier: "quick", cache: false, signal });
    }
    const key = $("apiKey").value.trim();
    if (!key) throw { code: "no_key" };
    const r = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST", signal,
      headers: { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: $("model").value, max_tokens: 300, system: RULES, messages: msgs })
    });
    if (r.status === 401 || r.status === 403) throw { code: "bad_key" };
    if (r.status === 429) throw { code: "rate_limited" };
    if (!r.ok) throw { code: "upstream_error", message: String(r.status) };
    const data = await r.json();
    const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
    return parseJSON(text);
  }

  // ---------- voices ----------
  const synth = window.speechSynthesis;
  let voices = [];
  const isEn = (v) => /^en[-_]/i.test(v.lang);
  function loadVoices() {
    if (!synth) return false;
    const all = synth.getVoices();
    if (!all.length) return false;
    voices = all.filter(isEn);
    const sel = $("voice"); sel.innerHTML = "";
    if (!voices.length) { sel.append(new Option("영어 원어민 목소리 없음", "")); return true; }
    const rank = (v) => {
      const n = v.name, us = /en[-_]US/i.test(v.lang);
      if (/Natural/i.test(n) && us && /Aria|Jenny|Ava|Emma|Michelle/i.test(n)) return 0;
      if (/Natural/i.test(n) && us) return 1;
      if (/Natural/i.test(n)) return 2;
      if (/Samantha|Ava|Allison/.test(n) && us) return 3;
      if (/network/i.test(n) && us) return 3;
      if (/Google US English/.test(n)) return 4;
      if (us) return 5;
      return 6;
    };
    voices.sort((a, b) => rank(a) - rank(b));
    voices.forEach(v => sel.append(new Option(`${v.name} (${v.lang})`, v.name)));
    sel.value = (prefs.voice && voices.some(v => v.name === prefs.voice)) ? prefs.voice : voices[0].name;
    return true;
  }
  function currentVoice() { return voices.find(v => v.name === $("voice").value) || null; }

  function speak(text, onDone) {
    lastSpoken = text;
    const v = currentVoice();
    if (!synth || !text || !v) { onDone && onDone(); return; }
    if (synth.speaking || synth.pending) synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = v; u.lang = v.lang; u.rate = Number($("rate").value) || 1; u.pitch = 1.02;
    let done = false;
    const finish = () => { if (!done) { done = true; onDone && onDone(); } };
    u.onend = finish; u.onerror = finish;
    setTimeout(finish, Math.min(30000, 1500 + text.length * 80));
    setTimeout(() => synth.speak(u), 60);
  }

  // ---------- speech recognition ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, recRunning = false;
  let finalText = "", interimText = "";
  let silenceT = null, nudgeT = null, tickT = null, deadline = 0;

  function makeRec() {
    rec = new SR();
    rec.lang = "en-US"; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 1;
    rec.onstart = () => { recRunning = true; };
    rec.onresult = (e) => {
      let f = "", i = "";
      for (let k = e.resultIndex; k < e.results.length; k++) {
        const t = e.results[k][0].transcript;
        if (e.results[k].isFinal) f += t; else i += t;
      }
      if (f) finalText = (finalText + " " + f).replace(/\s+/g, " ").trim();
      interimText = i.trim();
      renderHajun();
      clearTimeout(nudgeT);
      armSilence();
    };
    rec.onerror = (e) => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        wantListening = false; recRunning = false; setState("paused");
        setStatus("마이크 권한이 막혔어요. 주소창 자물쇠 → 마이크 허용을 켜거나, 이 파일을 Edge에서 직접 열어 주세요.", true);
      }
    };
    rec.onend = () => {
      recRunning = false;
      if (state === "listening" && wantListening) { try { rec.start(); } catch {} }   // keep the mic open
    };
  }
  function startListening() {
    if (!SR || !wantListening) return;
    if (!rec) makeRec();
    finalText = ""; interimText = ""; renderHajun();
    setState("listening");
    setStatus("");
    if (!recRunning) { try { rec.start(); } catch {} }
    clearTimeout(nudgeT);
    nudgeT = setTimeout(() => {
      if (state === "listening" && !(finalText + interimText).trim()) sendTurn("[Hajun has been quiet for 25 seconds.]", true);
    }, NUDGE_MS);
  }
  function stopListening() {
    clearTimeout(silenceT); clearTimeout(nudgeT); clearInterval(tickT); $("countdown").textContent = "";
    if (rec && recRunning) { try { rec.stop(); } catch {} }
  }
  function armSilence() {
    clearTimeout(silenceT); clearInterval(tickT);
    deadline = Date.now() + SILENCE();
    tickT = setInterval(() => {
      const s = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      $("countdown").textContent = s > 0 ? `⏳ ${s}` : "";
    }, 250);
    silenceT = setTimeout(() => {
      clearInterval(tickT); $("countdown").textContent = "";
      const t = (finalText + " " + interimText).trim();
      if (t && state === "listening") sendTurn(t, false);
    }, SILENCE());
  }
  function renderHajun() {
    const el = $("hajunLine"); el.innerHTML = "";
    if (finalText) el.append(finalText + " ");
    if (interimText) { const s = document.createElement("span"); s.className = "interim"; s.textContent = interimText; el.append(s); }
  }

  // ---------- turn ----------
  function sendTurn(text, isSystem) {
    stopListening();
    if (!isSystem) { stars += 1; renderStars(); $("hajunLine").textContent = text; }
    const content = isSystem ? text : `Hajun said: "${text}"`;
    ask(content);
  }
  async function ask(content) {
    setState("thinking");
    $("teacherLine").textContent = ""; $("teacherLine").classList.add("thinking-dots");
    ctl && ctl.abort(); ctl = new AbortController();
    const msgs = [...turns, { role: "user", content }];
    try {
      const data = await brain(msgs, ctl.signal);
      if (!data || typeof data !== "object" || !data.say) throw { code: "invalid_json" };
      turns.push({ role: "user", content }, { role: "assistant", content: JSON.stringify(data) });
      while (turns.length > 20) turns.splice(0, 2);
      render(data);
    } catch (e) {
      const code = (e && e.code) || (e && e.name === "AbortError" ? "cancelled" : "upstream_error");
      if (code === "cancelled") return;
      const copy = {
        no_key: "API 키를 넣어 주세요.", bad_key: "API 키가 맞지 않아요.",
        not_granted: "Claude 사용을 허용해야 Miss Lily가 말해요. 페이지를 다시 열고 허용해 주세요.",
        rate_limited: "너무 빨라요. 잠깐 쉬었다가 다시 해요.", refused: "이 주제는 어려워요. 다른 주제로 시작해 볼까요?",
        invalid_json: "Miss Lily가 잠깐 헷갈렸어요. 다시 보내기를 눌러 주세요.", empty_completion: "Miss Lily가 말을 잃었어요. 다시 보내기를 눌러 주세요."
      };
      setStatus(copy[code] || "연결이 잠깐 끊겼어요. 다시 보내기를 눌러 주세요.", true);
      $("teacherLine").classList.remove("thinking-dots");
      $("sendNow").dataset.retry = content;
      setState("paused");
    }
  }
  function render(d) {
    $("teacherLine").classList.remove("thinking-dots");
    const emo = String(d.emoji || "🥋").trim().split(/\s+/).slice(0, 4);
    const em = $("emoji"); em.innerHTML = ""; emo.forEach(e => { const s = document.createElement("span"); s.textContent = e + " "; em.append(s); });
    em.classList.remove("bump"); void em.offsetWidth; em.classList.add("bump");
    $("caption").textContent = d.scene || "";
    const say = String(d.say).trim();
    $("teacherLine").textContent = say;
    setState("speaking");
    speak(say, () => { if (wantListening) setTimeout(startListening, 600); else setState("paused"); });
  }

  // ---------- ui helpers ----------
  function setState(s) {
    state = s;
    const chip = $("stateChip"); chip.className = "state " + s;
    chip.textContent = { listening: "👂 하준이 차례", thinking: "🤔 생각 중", speaking: "🗣 Miss Lily", paused: "⏸ 멈춤", idle: "준비" }[s] || s;
    $("pause").textContent = (s === "paused") ? "▶ 다시 시작" : "⏸ 잠깐 멈춤";
  }
  function setStatus(msg, err) { const s = $("status"); s.className = "status" + (err ? " err" : ""); s.textContent = msg || ""; }
  function renderStars() { const el = $("stars"); el.innerHTML = ""; for (let i = 0; i < Math.max(8, stars); i++) { const s = document.createElement("span"); s.textContent = "⭐"; if (i < stars) s.classList.add("on"); el.append(s); } }

  // ---------- wiring ----------
  $("chips").addEventListener("click", (e) => { const b = e.target.closest(".chip"); if (b) $("interest").value = b.textContent; });
  $("voice").addEventListener("change", () => { prefs.voice = $("voice").value; save(); });
  ["silence", "rate", "model"].forEach(id => { if (prefs[id]) $(id).value = prefs[id]; $(id).addEventListener("change", () => { prefs[id] = $(id).value; save(); }); });
  if (prefs.apiKey) $("apiKey").value = prefs.apiKey;
  $("apiKey").addEventListener("change", () => { prefs.apiKey = $("apiKey").value.trim(); save(); });
  $("testVoice").addEventListener("click", () => { loadVoices(); if (!currentVoice()) { setDiag(); return; } speak("Hey Hajun! I'm Miss Lily. Are you ready to play?"); });
  $("replay").addEventListener("click", () => { if (state === "listening") stopListening(); setState("speaking"); speak(lastSpoken, () => { if (wantListening) startListening(); }); });
  $("pause").addEventListener("click", () => {
    if (state === "paused") { wantListening = true; startListening(); }
    else { wantListening = false; stopListening(); synth && synth.cancel(); ctl && ctl.abort(); setState("paused"); }
  });
  $("sendNow").addEventListener("click", () => {
    const retry = $("sendNow").dataset.retry;
    if (retry && state === "paused") { delete $("sendNow").dataset.retry; wantListening = true; ask(retry); return; }
    const t = (finalText + " " + interimText).trim();
    if (state === "listening" && t) sendTurn(t, false);
  });
  $("quit").addEventListener("click", () => { wantListening = false; stopListening(); synth && synth.cancel(); ctl && ctl.abort(); setState("idle"); $("play").hidden = true; $("setup").hidden = false; });

  $("start").addEventListener("click", () => {
    const interest = $("interest").value.trim() || "유도 vs 태권도";
    if (synth) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; synth.speak(u); }
    turns = []; stars = 0; renderStars(); finalText = ""; interimText = ""; renderHajun();
    $("topic").textContent = "오늘 주제: " + interest;
    $("setup").hidden = true; $("play").hidden = false;
    wantListening = true;
    ask(`NEW STORY. Today's interest: ${interest}. Say hi to Hajun, introduce the characters in one breath, start the action, and ask your first easy question.`);
  });

  // ---------- diagnostics ----------
  function setDiag() {
    const v = currentVoice();
    const lines = [];
    lines.push(mode === "claude" ? `<span class="ok">✔ Miss Lily 두뇌: Claude 연결됨</span>` : mode === "api" ? `<span class="ok">✔ Miss Lily 두뇌: API 키로 연결</span>` : `<span class="bad">✘ 두뇌 연결 확인 중…</span>`);
    lines.push(SR ? `<span class="ok">✔ 마이크 인식: 이 브라우저에서 가능</span>` : `<span class="bad">✘ 이 브라우저는 음성 인식이 안 돼요 — PC의 Edge나 크롬으로 열어 주세요</span>`);
    if (!synth) lines.push(`<span class="bad">✘ 음성 엔진 없음</span>`);
    else if (!v) lines.push(`<span class="bad">✘ 영어 원어민 목소리가 없어요. 콩글리시 목소리는 쓰지 않아요 — PC의 Edge에서 열면 Microsoft Natural 원어민 목소리가 있어요</span>`);
    else lines.push(`<span class="ok">✔ 목소리: ${v.name}</span>` + (/Natural/i.test(v.name) ? " (원어민급)" : " — Edge 브라우저면 더 자연스러운 Natural 목소리를 쓸 수 있어요"));
    $("diag").innerHTML = lines.join("<br>");
    $("start").disabled = !(mode && SR && v);
  }
  if (synth) {
    $("voice").append(new Option("목소리 찾는 중…", ""));
    synth.onvoiceschanged = () => { loadVoices(); setDiag(); };
    let tries = 0; const poll = () => { if (loadVoices() || tries++ > 16) { setDiag(); return; } setTimeout(poll, 250); }; poll();
  } else { $("voice").append(new Option("음성 엔진 없음", "")); }

  (async () => {
    if (window.claude && typeof window.claude.use === "function") {
      sample = await window.claude.use("sample");
    }
    if (sample) mode = "claude";
    else { mode = "api"; $("apiField").hidden = false; }
    setDiag();
  })();
})();
</script>
</body>
</html>
